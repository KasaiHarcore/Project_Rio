<div class="min-h-screen bg-[#F4F9FF] flex items-center justify-center p-6 font-sans">
  <div class="w-full max-w-md bg-white border border-blue-100 rounded-[2.5rem] shadow-2xl p-10 relative overflow-hidden">
    
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-12 h-12 bg-blue-500 rounded-xl mb-4 text-white shadow-lg shadow-blue-100">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-slate-800 tracking-tight">New Enrollment</h1>
      <p class="text-slate-500 text-sm mt-2 font-medium">Create your Schale Account ID</p>
    </div>

    <div class="space-y-4">
      <div>
        <label class="text-[10px] font-black text-blue-500 uppercase tracking-[0.2em] ml-2">Full Name</label>
        <input type="text" placeholder="Sensei Name" class="w-full px-5 py-4 bg-white border border-blue-100 rounded-2xl focus:ring-4 focus:ring-blue-100 focus:border-blue-400 transition-all outline-none text-slate-700 placeholder:text-slate-300" />
      </div>
      <div>
        <label class="text-[10px] font-black text-blue-500 uppercase tracking-[0.2em] ml-2">Email Address</label>
        <input type="email" placeholder="sensei@schale.edu" class="w-full px-5 py-4 bg-white border border-blue-100 rounded-2xl focus:ring-4 focus:ring-blue-100 focus:border-blue-400 transition-all outline-none text-slate-700 placeholder:text-slate-300" />
      </div>
      <div>
        <label class="text-[10px] font-black text-blue-500 uppercase tracking-[0.2em] ml-2">Secure Password</label>
        <input type="password" placeholder="••••••••" class="w-full px-5 py-4 bg-white border border-blue-100 rounded-2xl focus:ring-4 focus:ring-blue-100 focus:border-blue-400 transition-all outline-none text-slate-700 placeholder:text-slate-300" />
        <div class="flex mt-2 px-1 space-x-1">
          <div class="h-1 flex-1 bg-blue-400 rounded-full"></div>
          <div class="h-1 flex-1 bg-blue-400 rounded-full"></div>
          <div class="h-1 flex-1 bg-blue-100 rounded-full"></div>
        </div>
      <div>
        <label class="text-[10px] font-black text-blue-500 uppercase tracking-[0.2em] ml-2">Re-typed Password</label>
        <input type="retype_password" placeholder="••••••••" class="w-full px-5 py-4 bg-white border border-blue-100 rounded-2xl focus:ring-4 focus:ring-blue-100 focus:border-blue-400 transition-all outline-none text-slate-700 placeholder:text-slate-300" />
      </div>
    </div>

    <button class="w-full py-4 bg-blue-500 hover:bg-blue-600 text-white font-black rounded-2xl shadow-xl shadow-blue-100 mt-8 transition-all active:scale-95 uppercase tracking-widest text-sm">
      Initiate Enrollment
    </button>

    <p class="text-center mt-8 text-xs font-bold text-slate-400 uppercase tracking-tight">
      Already have an ID? <a href="#" class="text-blue-500 hover:underline">Log In</a>
    </p>
  </div>
</div>
