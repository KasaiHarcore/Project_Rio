<div class="flex min-h-screen items-center justify-center bg-[#F4F9FF] p-6 font-sans">
  <div class="relative w-full max-w-md overflow-hidden rounded-[2.5rem] border border-blue-100 bg-white p-10 shadow-2xl">
    <div class="absolute -top-10 -right-10 h-32 w-32 rounded-full bg-blue-400/10 blur-3xl"></div>
    <div class="absolute -bottom-10 -left-10 h-40 w-40 rounded-full bg-blue-300/10 blur-3xl"></div>

    <div class="mb-10 text-center">
      <div class="mb-4 inline-flex h-16 w-16 items-center justify-center rounded-2xl bg-blue-500 shadow-lg shadow-blue-200">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">/* Icon</svg>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-slate-800">System Login</h1>
      <p class="mt-2 text-sm font-medium text-slate-500">Please authenticate to access your AI Agent</p>
    </div>

    <form class="space-y-5">
      <div>
        <label class="mb-2 ml-1 block text-xs font-bold tracking-widest text-blue-600 uppercase">Email Address</label>
        <input type="email" placeholder="sensei@schale.edu" class="w-full rounded-2xl border border-blue-100 bg-white px-5 py-4 text-slate-700 transition-all outline-none placeholder:text-slate-300 focus:border-blue-400 focus:ring-4 focus:ring-blue-100" />
      </div>

      <div>
        <div class="mb-2 ml-1 flex justify-between">
          <label class="text-xs font-bold tracking-widest text-blue-600 uppercase">Password</label>
          <a href="#" class="text-xs font-semibold text-blue-400 transition-colors hover:text-blue-600">Forgot?</a>
        </div>
        <input type="password" placeholder="••••••••" class="w-full rounded-2xl border border-blue-100 bg-white px-5 py-4 text-slate-700 transition-all outline-none placeholder:text-slate-300 focus:border-blue-400 focus:ring-4 focus:ring-blue-100" />
      </div>

      <button class="mt-4 w-full transform rounded-2xl bg-blue-500 py-4 font-bold text-white shadow-lg shadow-blue-200 transition-all hover:-translate-y-1 hover:bg-blue-600 active:scale-95">Connect to Agent</button>
    </form>

    <div class="mt-10">
      <div class="relative mb-8 flex items-center justify-center">
        <div class="absolute w-full border-t border-blue-50"></div>
        <span class="relative bg-white/0 px-4 text-xs font-bold tracking-tighter text-blue-300 uppercase">Quick Access</span>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <button class="flex items-center justify-center rounded-xl border border-blue-100 py-3 transition-colors hover:bg-blue-50">
          <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="mr-2 h-5 w-5" alt="Google" />
          <span class="text-sm font-semibold text-slate-600">Google</span>
        </button>
        <button class="flex items-center justify-center rounded-xl border border-blue-100 py-3 transition-colors hover:bg-blue-50">
          <img src="https://www.svgrepo.com/show/475654/github-color.svg" class="mr-2 h-5 w-5" alt="Github" />
          <span class="text-sm font-semibold text-slate-600">Github</span>
        </button>
      </div>
    </div>

    <p class="mt-10 text-center text-sm font-medium text-slate-400">New user? <a href="#" class="font-bold text-blue-500 hover:underline">Create an ID</a></p>
  </div>
</div>
