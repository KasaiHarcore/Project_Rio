[project]
name = "project-rio"
version = "0.1.0"
description = "Project Rio — AI-powered study agent with RAG, multi-agent workflows, and knowledge graph."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "loguru",
  "rich",
  "pydantic",
  "python-dotenv",
  "requests",
  "langchain-core",
  "langchain-community",
  "langchain",
  "langgraph",
  "langchain-openai",
  "arize-phoenix-otel",
  "arize-phoenix>=13.21.0",
  "openinference-instrumentation-langchain",
  "langchain-tavily",
  "fastapi[standard]",
  "streamlit",
  "langchain-qdrant",
  "qdrant-client",
  "pypdf",
  "sqlalchemy",
  "chonkie[semantic]",
  "rank_bm25",
  "cohere",
  "langchain-huggingface",
  "sentence_transformers",
  "psycopg2-binary",
  "alembic",
  "argon2-cffi",
  "pgvector",
  "redis",
  "langchain-redis",
  "pyjwt",
  "httpx",
  "websockets",
  "cryptography",
  "prometheus-fastapi-instrumentator",
  "langchain-neo4j",
  "langchain-experimental",
  "langchain-cohere",
  "langchain-text-splitters",
  "langchain-classic",
  "passlib",
  "fastembed",
  "langgraph-checkpoint-postgres",
  "croniter>=2.0",
  "edge-tts>=6.0",
  "mcp>=1.0",
  "qwen-tts>=0.1",
  "soundfile>=0.12",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.10",
  "safety>=3.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["core*", "application*", "infrastructure*", "interfaces*", "utils*", "frontend*"]

# ── Pytest ──────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

# ── Coverage ────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.",
]

# ── Ruff ────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["core", "application", "infrastructure", "interfaces", "utils"]

# ── Mypy ────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
