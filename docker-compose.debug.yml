# Development override — use with:
#   docker compose -f docker-compose.yml -f docker-compose.debug.yml up
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    volumes:
      - ./src:/app/src
      - ./alembic.ini:/app/alembic.ini
      - ./main.py:/app/main.py
    command:
      - uvicorn
      - core.app:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src
    ports:
      - "${API_PORT:-8000}:8000"
      - "5678:5678"  # debugpy
    environment:
      DEBUG: "true"
